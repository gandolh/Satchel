# Satchel's API. Build context is the repo root (..) because the image needs the
# root lockfile and every workspace manifest.
#
#   docker compose -f infrastructure/docker-compose.yml up -d satchel-api
#
# `.env` in THIS directory is written by the deploy (vps-deploy's `server`
# phase, 0600) and is read twice: compose interpolates ${...} below from it, and
# the service declares it as env_file so the same values reach the process.
# For a local run, copy the Ward trio from the repo's `.env`. It is git-ignored
# because it carries the Ward service key.
services:
  satchel-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: prod
    image: satchel-api:1.0
    ports:
      # LOOPBACK ONLY. Without the 127.0.0.1 prefix this would be published on
      # every interface, reachable over plain HTTP past Caddy and its TLS. The
      # server's HOST is 0.0.0.0 because that is inside the container's network
      # namespace; this line is what decides who can reach it.
      - "127.0.0.1:${SATCHEL_PORT:-8795}:${SATCHEL_PORT:-8795}"
    env_file:
      - .env
    # These beat env_file. A dev .env copied here (HOST=127.0.0.1, PORT=8807,
    # DATA_DIR=./data) would otherwise override the image's ENV and leave the
    # server unreachable from the published port, or writing outside /data.
    # PORT follows SATCHEL_PORT so the publish line, the healthcheck and the
    # listening port always agree.
    environment:
      HOST: 0.0.0.0
      PORT: "${SATCHEL_PORT:-8795}"
      DATA_DIR: /data
    volumes:
      # The message database. Bind-mounted from the host so it survives deploys
      # and "back up Satchel" means one path. Defaults to a local dir so a dev
      # `compose up` works.
      - ${SATCHEL_DATA_DIR:-../data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:${SATCHEL_PORT:-8795}/api/health\""]
      interval: 30s
      timeout: 3s
      start_period: 10s
